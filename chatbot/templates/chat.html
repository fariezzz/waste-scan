<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.A.S.T.E AI Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="chat-container">
        <h2>♻️ W.A.S.T.E AI Chatbot</h2>

        <!-- Area untuk chat -->
        <div id="chat-box"></div>

        <!-- Area input -->
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ketik pesan di sini..." autofocus />
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const input = document.getElementById("user-input");

        // Fungsi kirim pesan ke backend
        async function sendMessage() {
            const userText = input.value.trim();
            if (!userText) return;

            // Tampilkan pesan user di layar
            appendMessage("🧍 Kamu", userText, "user");

            // Kirim ke backend
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    messages: [{ role: "user", content: userText }]
                })
            });

            const data = await response.json();

            // Tampilkan balasan dari AI
            appendMessage("🤖 W.A.S.T.E", data.reply, "ai");

            // Reset input
            input.value = "";
            input.focus();
        }

        // Fungsi untuk menambahkan pesan ke chat-box
        function appendMessage(sender, text, type) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", type);
            messageDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Enter = kirim pesan
        input.addEventListener("keypress", function (e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
